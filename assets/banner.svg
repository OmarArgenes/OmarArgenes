<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Omar Argenes Quispe — Web Systems Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a1a"/>
      <stop offset="1" stop-color="#05060d"/>
    </linearGradient>
    <radialGradient id="auroraA" cx="0.08" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#2b5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx="0.85" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#8b7bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee7ff"/>
      <stop offset="0.55" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#ff6bd5"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.3" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fb0d8"/>
    </linearGradient>
    <radialGradient id="globeFill" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#28407a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#080a18" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#5ee7ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5ee7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#8fd8ff" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="globeClip"><circle cx="960" cy="160" r="118"/></clipPath>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect x="0" y="200" width="1200" height="120" fill="url(#gridFade)"/></mask>
    <style>
      .name { font: 700 58px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1.5px; }
      .role { font: 600 26px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font: 500 15px 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
      .label { font: 500 12px 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; fill: #dfe6ff; }
      .pill { font: 600 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #c9ffe3; }
      .pulse { animation: pulse 2s ease-out infinite; transform-origin: 72px 60px; }
      .ring { animation: ring 2.8s ease-out infinite; }
      .ring.b { animation-delay: 1.4s; }
      .caret { animation: blink 1s steps(1) infinite; }
      .spin { animation: spin 40s linear infinite; transform-origin: 960px 160px; }
      @keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(3); } }
      @keyframes ring { 0% { r: 4; opacity: .9; } 100% { r: 26; opacity: 0; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#auroraA)"/>
  <rect width="1200" height="320" rx="18" fill="url(#auroraB)"/>

  <!-- perspective grid -->
  <g mask="url(#gridMask)" stroke="#5ee7ff" stroke-opacity="0.18" stroke-width="1">
    <path d="M0 250 H1200 M0 272 H1200 M0 298 H1200 M0 319 H1200"/>
    <path d="M600 200 L-300 320 M600 200 L0 320 M600 200 L200 320 M600 200 L400 320 M600 200 L600 320 M600 200 L800 320 M600 200 L1000 320 M600 200 L1200 320 M600 200 L1500 320"/>
  </g>

  <!-- status pill -->
  <g>
    <rect x="56" y="44" width="300" height="32" rx="16" fill="#3dff9e" fill-opacity="0.07" stroke="#3dff9e" stroke-opacity="0.35"/>
    <circle class="pulse" cx="72" cy="60" r="5" fill="#3dff9e"/>
    <circle cx="72" cy="60" r="5" fill="#3dff9e"/>
    <text x="86" y="65" class="pill">Open to remote roles · UTC-4</text>
  </g>

  <!-- name + role -->
  <text x="54" y="148" class="name" fill="url(#nameGrad)">Omar Argenes Quispe</text>
  <text x="56" y="192" class="role"><tspan fill="#8b7bff">&gt; </tspan><tspan fill="url(#grad)">Web Systems Engineer</tspan></text>
  <rect class="caret" x="358" y="172" width="11" height="24" fill="#5ee7ff"/>
  <text x="58" y="238" class="mono" fill="#9aa3bf">Angular · PHP · WordPress · Linux in production · AI-assisted debugging</text>

  <!-- globe -->
  <circle cx="960" cy="160" r="175" fill="url(#glow)"/>
  <circle cx="960" cy="160" r="118" fill="url(#globeFill)"/>
  <g clip-path="url(#globeClip)">
    <rect class="spin" x="780" y="-20" width="360" height="360" fill="url(#dots)"/>
  </g>
  <circle cx="960" cy="160" r="118" fill="none" stroke="#5ee7ff" stroke-opacity="0.35"/>
  <ellipse cx="960" cy="160" rx="118" ry="38" fill="none" stroke="#5ee7ff" stroke-opacity="0.12"/>
  <ellipse cx="960" cy="160" rx="45" ry="118" fill="none" stroke="#5ee7ff" stroke-opacity="0.12"/>

  <!-- orbit -->
  <ellipse cx="960" cy="160" rx="170" ry="40" fill="none" stroke="#8b7bff" stroke-opacity="0.45" transform="rotate(-18 960 160)"/>
  <circle r="3.5" fill="#ffffff">
    <animateMotion dur="9s" repeatCount="indefinite" path="M1130 160 A170 40 0 1 1 790 160 A170 40 0 1 1 1130 160" rotate="0"/>
  </circle>

  <!-- arc Cochabamba -> Hamburg -->
  <path id="arc" d="M892 228 Q 900 70 1010 92" fill="none" stroke="#8b7bff" stroke-opacity="0.55" stroke-width="1.6"/>
  <path d="M892 228 Q 900 70 1010 92" fill="none" stroke="#5ee7ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 400">
    <animate attributeName="stroke-dashoffset" from="440" to="0" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <circle r="3.4" fill="#fff">
    <animateMotion dur="2.8s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#arc"/>
    </animateMotion>
  </circle>

  <!-- cities -->
  <circle class="ring" cx="892" cy="228" r="4" fill="none" stroke="#3dff9e" stroke-width="1.5"/>
  <circle cx="892" cy="228" r="4" fill="#3dff9e"/>
  <circle class="ring b" cx="1010" cy="92" r="4" fill="none" stroke="#3dff9e" stroke-width="1.5"/>
  <circle cx="1010" cy="92" r="4" fill="#3dff9e"/>
  <path d="M892 228 L870 268 H812" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
  <text x="808" y="272" class="label" text-anchor="end">Cochabamba · UTC-4</text>
  <path d="M1010 92 L1036 70 H1070" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
  <text x="1074" y="74" class="label">Hamburg · CET</text>
</svg>
